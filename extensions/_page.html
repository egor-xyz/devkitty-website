<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#FBF6F0"
    />

    <!-- Primary Meta Tags -->
    <link
      rel="canonical"
      href="https://devkitty.app/extensions/%EXT_ID%/"
    />
    <title>%EXT_NAME% | Devkitty extensions</title>
    <meta
      name="title"
      content="%EXT_NAME% | Devkitty extensions"
    />
    <meta
      name="description"
      content="%EXT_TAGLINE%"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://devkitty.app/extensions/%EXT_ID%/"
    />
    <meta
      property="og:title"
      content="%EXT_NAME% | Devkitty extensions"
    />
    <meta
      property="og:description"
      content="%EXT_TAGLINE%"
    />
    <meta
      property="og:image"
      content="https://devkitty.app%EXT_OG%"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:url"
      content="https://devkitty.app/extensions/%EXT_ID%/"
    />
    <meta
      name="twitter:title"
      content="%EXT_NAME% | Devkitty extensions"
    />
    <meta
      name="twitter:description"
      content="%EXT_TAGLINE%"
    />
    <meta
      name="twitter:image"
      content="https://devkitty.app%EXT_OG%"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicons/favicon-32x32.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicons/favicon-16x16.png?v=3"
    />
    <link
      rel="manifest"
      href="/manifest.json"
    />
    <link
      rel="shortcut icon"
      href="/favicons/favicon.ico?v=3"
    />
    <meta
      name="msapplication-TileColor"
      content="#0E0620"
    />
  </head>

  <body data-page="extension" data-extension-id="%EXT_ID%">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">%EXT_PRERENDER%</div>

    <script
      type="module"
      src="/src/entries/extensions.tsx"
    ></script>
  </body>
</html>
