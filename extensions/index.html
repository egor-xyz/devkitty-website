<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="color-scheme"
      content="light"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#FBF6F0"
    />

    <!-- Primary Meta Tags -->
    <link
      rel="canonical"
      href="https://devkitty.app/extensions/"
    />
    <title>Extensions | Devkitty</title>
    <meta
      name="title"
      content="Extensions | Devkitty"
    />
    <meta
      name="description"
      content="Turn on only what you use: the optional extensions that ship with Devkitty."
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://devkitty.app/extensions/"
    />
    <meta
      property="og:title"
      content="Extensions | Devkitty"
    />
    <meta
      property="og:description"
      content="Turn on only what you use: the optional extensions that ship with Devkitty."
    />
    <meta
      property="og:image"
      content="https://devkitty.app/og.png?v=2"
    />
    <meta
      property="og:site_name"
      content="Devkitty"
    />
    <meta
      property="og:locale"
      content="en_US"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />
    <meta
      property="og:image:type"
      content="image/png"
    />
    <meta
      property="og:image:alt"
      content="Devkitty: a cartoon developer at a desk, coding in the Devkitty app while a cat sleeps"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:url"
      content="https://devkitty.app/extensions/"
    />
    <meta
      name="twitter:title"
      content="Extensions | Devkitty"
    />
    <meta
      name="twitter:description"
      content="Turn on only what you use: the optional extensions that ship with Devkitty."
    />
    <meta
      name="twitter:image"
      content="https://devkitty.app/og.png?v=2"
    />
    <meta
      name="twitter:image:alt"
      content="Devkitty: a cartoon developer at a desk, coding in the Devkitty app while a cat sleeps"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicons/favicon-32x32.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicons/favicon-16x16.png?v=3"
    />
    <link
      rel="manifest"
      href="/manifest.json"
    />
    <link
      rel="shortcut icon"
      href="/favicons/favicon.ico?v=3"
    />
    <meta
      name="msapplication-TileColor"
      content="#0E0620"
    />
  </head>

  <body data-page="extensions-index">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">%EXT_LIST%</div>

    <script
      type="module"
      src="/src/entries/extensions.tsx"
    ></script>
  </body>
</html>
