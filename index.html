<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <script>
      // Resolve the theme before first paint (no flash). Must stay the first script in <head>.
      (function () {
        var choice = 'system';
        try {
          var stored = localStorage.getItem('devkitty-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') choice = stored;
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta
      name="theme-color"
      content="#FBF6F0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0E0620"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Primary Meta Tags -->
    <title>Devkitty: every repo, worktree and pull request in one calm window</title>
    <meta
      name="title"
      content="Devkitty: every repo, worktree and pull request in one calm window"
    />
    <meta
      name="description"
      content="Devkitty is a native macOS workspace for Git, GitHub and your terminals."
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://devkitty.app/"
    />
    <meta
      property="og:title"
      content="Devkitty: every repo, worktree and pull request in one calm window"
    />
    <meta
      property="og:description"
      content="Devkitty is a native macOS workspace for Git, GitHub and your terminals."
    />
    <meta
      property="og:image"
      content="https://devkitty.app/og.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta

      content="https://devkitty.app/"
    />
    <meta
      name="twitter:title"

    />
    <meta
      name="twitter:description"
      content="Devkitty is a native macOS workspace for Git, GitHub and your terminals."

    <meta

    <link
      rel="apple-touch-icon"

      href="https://devkitty.app/favicons/apple-touch-icon.png"
    />
    <link
