<!doctype html>
<html lang="en">
  <head>
    <script>
      // One page colour: mirror the saved hero mode on <html> before first paint (home defaults to grey, other pages to peach).
      try {
        var m = sessionStorage.getItem('devkitty-mode');
        document.documentElement.dataset.mode =
          m === 'devkitty' || (m !== 'bw' && location.pathname !== '/') ? 'lit' : 'bw';
      } catch (e) {
        document.documentElement.dataset.mode = location.pathname === '/' ? 'bw' : 'lit';
      }
    </script>
    <meta charset="utf-8" />
    <meta
      name="color-scheme"
      content="light"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#FBF6F0"
    />
