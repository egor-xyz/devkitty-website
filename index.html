<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta charset="utf-8" />
    <meta
      name="theme-color"
      content="#18032f"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!-- Primary Meta Tags -->
    <title>Devkitty — All your repos. One calm window.</title>
    <meta
      name="title"
      content="Devkitty — All your repos. One calm window."
    />
    <meta
      name="description"
      content="A native macOS desktop app that keeps every repository, GitHub Action, pull request and branch in one window."
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://devkitty.app/"
    />
    <meta
      property="og:title"
      content="Devkitty — All your repos. One calm window."
    />
    <meta
      property="og:description"
      content="A native macOS app that keeps every repository, GitHub Action, pull request and branch in one window."
    />
    <meta
      property="og:image"
      content="https://devkitty.app/devkitty.app.png"
    />

    <!-- Twitter -->
    <meta
      property="twitter:card"
      content="summary_large_image"
    />
    <meta
      property="twitter:url"
      content="https://devkitty.app/"
    />
    <meta
      property="twitter:title"
      content="Devkitty — All your repos. One calm window."
    />
    <meta
      property="twitter:description"
      content="A native macOS app that keeps every repository, GitHub Action, pull request and branch in one window."
    />
    <meta
      property="twitter:image"
      content="https://devkitty.app/devkitty.app.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://devkitty.app/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://devkitty.app/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="https://devkitty.app/favicons/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="https://devkitty.app/favicons/site.webmanifest"
    />
    <link
      rel="mask-icon"
      href="https://devkitty.app/favicons/safari-pinned-tab.svg"
      color="#ED7035"
    />
    <link
      rel="shortcut icon"
      href="https://devkitty.app/favicons/favicon.ico"
    />

    <link
      rel="manifest"
      href="/manifest.json"
    />
    <meta
      name="msapplication-TileColor"
      content="#ffffff"
    />
    <meta
      name="msapplication-TileImage"
      content="/ms-icon-144x144.png"
    />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script
      type="module"
      src="/src/index.tsx"
    ></script>
  </body>
</html>
