<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <script>
      (function () {
        var choice = 'system';
        try {
          var stored = localStorage.getItem('devkitty-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') choice = stored;
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Privacy | Devkitty</title>
  </head>

  <body>
    <h1>Privacy</h1>
  </body>
</html>
